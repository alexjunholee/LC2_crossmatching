dataset:
  name: vivid
  root: /media/jhlee/EVO4TB/vivid_projects/data
  sequences: ["campus_day1", "campus_day2", "city_day1", "city_day2"]
  depth_cache_dir: cache/depth/vivid
  range_cache_dir: cache/range/vivid
  pos_threshold: 25.0

model:
  num_clusters: 16
  encoder_dim: 512

train:
  sequences: ["campus_day1", "campus_day2", "city_day1", "city_day2"]
  range_subsample: 3
  depth_subsample: 3
  batch_size: 4
  cache_batch_size: 16
  patience: 15

  # Phase 1: skip (use pretrained encoder)
  phase1_epochs: 0

  # Phase 2: GeM + Triplet Loss (KITTI v3 recipe)
  phase2_frozen_epochs: 5
  phase2_frozen_lr: 0.001
  phase2_epochs: 40
  phase2_lr: 0.0001

  # Triplet mining
  pos_dist_thr: 10.0
  neg_dist_thr: 25.0
  n_neg: 10
  margin: 0.05

  # Optimizer
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001
  lr_step: 10
  lr_gamma: 0.5

val:
  sequences: ["campus_val1", "campus_val2", "city_val1", "city_val2"]
  batch_size: 16
  recall_ks: [1, 5, 10]
  top_k: 10

eval:
  sequences: ["campus_val1", "campus_val2", "city_val1", "city_val2"]
  batch_size: 64
  top_k: 25
  recall_ks: [1, 5, 10, 15, 20]
  num_workers: 4

input:
  resize: [480, 640]
  camera_hfov_deg: 90.0
